name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest tests/ -q
      - name: OpenAPI path gate
        run: python -m pytest tests/test_openapi_contract.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Hallmark README lint
        run: |
          npm ci
          npm test
      - name: GPU renderer unit tests
        run: npm run gpu:test
      - name: GPU renderer typecheck
        run: npm run gpu:typecheck
